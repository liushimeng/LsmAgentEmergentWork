[package]
name = "lsm-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "LsmAgentEmergentWork - 基于 Rust 的 LLM Agent CLI 工程(laew)"
license = "MIT"
build = "build.rs"

[[bin]]
name = "laew"
path = "src/main.rs"

[lib]
name = "lsm_agent"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
# CancellationToken(取消传播,对齐 atomcode 原语;见 tmpPlan/2026-09-08_07 方案)
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env", "color"] }
rusqlite = { version = "0.31", features = ["bundled"] }
crossterm = "0.27"
sha2 = "0.10"
time = { version = "0.3", features = ["local-offset", "formatting", "std"], default-features = false }
walkdir = "2"
globset = "0.4"
regex = "1"
once_cell = "1"
similar = "2"   # diff 算法(claudecode 同款,纯 Rust,无系统依赖)

# D9-4 凭证加密(L1600):AES-256-GCM 应用层加密,落 SQLite 前透明加解密
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = "1"

# D9-7 SSRF 防护(L1608/L1625):URL 解析 + 私网/CGNAT 拦截
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# WindowUse Agent(第 9 角色)平台后端:Windows UI Automation + Win32
# (枚举 HWND 顶层窗口 / UIA 控件树遍历与操作 / SendMessage 降级)
# 设计见 docs/WindowUse桌面窗口操控Agent/01-设计与解决方案.md
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

# WindowUse Agent macOS 后端:Accessibility(AXUIElementRef)经 axuielement / core-foundation FFI 调用
# 2026-09-16 第 58 轮 P2:axuielement = "0.9" 是 pure-Rust 绑定 Accessibility framework
# (活跃维护,2026-06 更新),默认使用 axui 路径;旧 core-foundation 手写 FFI 落到
# macos_legacy.rs,通过 LAEW_MACOS_DRIVER=legacy 环境变量回退。
# 注意:axuielement 0.9 走 Swift 桥接,需要 macOS 13+ SDK 且系统装 Xcode 完整工具链
# (含 swiftCompatibility56 等库);工具链不全时编译会链接失败,临时方案:
#   cargo build --no-default-features --features macos-legacy
# 或 cargo build 时不引入 axui 路径,默认走 legacy(本轮 P2-D 已提供环境切换)。
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
axuielement = { version = "0.9", optional = true }

[features]
default = []
# macos-legacy:启用 axuielement typed API 路径(macos_axui.rs);
# 需 macOS 13+ SDK 与完整 Xcode 工具链;工具链不全时编译会链接失败。
# 启用方式:cargo build --features macos-legacy
# 或运行时切换:LAEW_MACOS_DRIVER=axui laew
macos-legacy = ["dep:axuielement"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
