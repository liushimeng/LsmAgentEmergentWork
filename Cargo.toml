[package]
name = "lsm-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "LsmAgentEmergentWork - 基于 Rust 的 LLM Agent CLI 工程(laew)"
license = "MIT"
build = "build.rs"

[[bin]]
name = "laew"
path = "src/main.rs"

[lib]
name = "lsm_agent"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
# CancellationToken(取消传播,对齐 atomcode 原语;见 tmpPlan/2026-09-08_07 方案)
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env", "color"] }
rusqlite = { version = "0.31", features = ["bundled"] }
crossterm = "0.27"
sha2 = "0.10"
time = { version = "0.3", features = ["local-offset", "formatting", "std"], default-features = false }
walkdir = "2"
globset = "0.4"
regex = "1"
once_cell = "1"
similar = "2"   # diff 算法(claudecode 同款,纯 Rust,无系统依赖)

# D9-4 凭证加密(L1600):AES-256-GCM 应用层加密,落 SQLite 前透明加解密
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = "1"

# D9-7 SSRF 防护(L1608/L1625):URL 解析 + 私网/CGNAT 拦截
url = "2.5"

# Chromium-WebUse Agent(第 11 角色,2026-09-16 第 61 轮):CDP 浏览器操控
# 选型见 docs/浏览器CDP工具/04-Chromium-WebUse-Agent设计与解决方案.md
chromiumoxide = "0.9"
futures = "0.3"

# build.rs 跨平台时间格式化(第 90 轮:修复 Windows 上 Command::new("date") 失败
# 导致 LAEW_BUILD_TIME 退化为 unix:xxx 的问题)。time 已在本 crate 出现,
# 在 [build-dependencies] 复用同一 crate,不增加新下载。
[build-dependencies]
time = { version = "0.3", features = ["local-offset", "formatting", "macros", "std"], default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# WindowUse Agent(第 9 角色)平台后端:Windows UI Automation + Win32
# (枚举 HWND 顶层窗口 / UIA 控件树遍历与操作 / SendMessage 降级)
# 设计见 docs/WindowUse桌面窗口操控Agent/01-设计与解决方案.md
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    # 2026-09-16 第 67 轮:WindowUse 视觉/物理输入路线
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Globalization",
    "Foundation_Collections",
] }

# WindowUse Agent macOS 后端:Accessibility(AXUIElementRef)
# 2026-09-16 第 61 轮:集成 axuielement = "0.9" typed 绑定(推荐路径);
# 本机若缺少 swiftCompatibility56 链接库,默认回退 core-foundation 手写 FFI
# (macos_legacy.rs)。完整 Xcode 工具链下可 --features macos-axui 启用。
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
# 2026-09-17 第 74 轮:macOS Vision OCR + CGWindow 原生截图
core-graphics = "0.23"
image = "0.25"
foreign-types = "0.5"
axuielement = { version = "0.9", optional = true }

[features]
default = []
# axuielement typed API 路径(macos_axui.rs)。
macos-axui = ["dep:axuielement"]
# 兼容第 58-60 轮历史脚本的 alias;它现在同样启用 axui 路径。
# 兼容第 58-60 轮历史脚本;显式启用时走 axui 路径。
macos-legacy = ["macos-axui"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
