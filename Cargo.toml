[package]
name = "lsm-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "LsmAgentEmergentWork - 基于 Rust 的 LLM Agent CLI 工程(laew)"
license = "MIT"
build = "build.rs"

[[bin]]
name = "laew"
path = "src/main.rs"

[lib]
name = "lsm_agent"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
# CancellationToken(取消传播,对齐 atomcode 原语;见 tmpPlan/2026-09-08_07 方案)
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env", "color"] }
rusqlite = { version = "0.31", features = ["bundled"] }
crossterm = "0.27"
sha2 = "0.10"
time = { version = "0.3", features = ["local-offset", "formatting", "std"], default-features = false }
walkdir = "2"
globset = "0.4"
regex = "1"
once_cell = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
